x-imagem-hub: &imagem-hub
  image: ${TEST_HUB_IMAGE:-test-hub:local}
  build: .

x-ambiente-hub: &ambiente-hub
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-testhub}:${POSTGRES_PASSWORD:-testhub}@postgres:5432/${POSTGRES_DB:-testhub}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testhub}
      POSTGRES_DB: ${POSTGRES_DB:-testhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  hub:
    <<: *imagem-hub
    command: sh -c "alembic upgrade head && exec uvicorn app.bootstrap.api:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *ambiente-hub
    ports:
      - "${HUB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/saude', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ADR-006: exatamente um worker, que só inicia com o hub saudável (migrações já aplicadas).
  # Quando a recuperação de runs presas existir, o comando passa a ser o entrypoint de
  # app/adapters/inbound/worker.
  worker:
    <<: *imagem-hub
    command: rq worker --url redis://redis:6379/0 runs
    environment:
      <<: *ambiente-hub
    deploy:
      replicas: 1
    depends_on:
      hub:
        condition: service_healthy

  target-api:
    <<: *imagem-hub
    command: uvicorn target_api.main:app --host 0.0.0.0 --port 8000
    environment:
      MODO_FALHA: ${MODO_FALHA:-false}
    ports:
      - "${TARGET_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/saude', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
