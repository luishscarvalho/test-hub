name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testhub
          POSTGRES_PASSWORD: testhub
          POSTGRES_DB: testhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testhub -d testhub"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://testhub:testhub@localhost:5432/testhub
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - name: Testes unitários e de integração
        run: uv run pytest -m "unit or integration" --cov --cov-report= --junitxml=reports/junit.xml
      - name: Cobertura total (mínimo 85%)
        run: uv run coverage report --fail-under=85
      - name: Cobertura de domain e application (100%, com branches)
        run: uv run coverage report --include="app/domain/*,app/application/*" --fail-under=100
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relatorio-junit
          path: reports/junit.xml

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: test-hub:ci
          outputs: type=docker,dest=${{ runner.temp }}/test-hub.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: imagem-hub
          path: ${{ runner.temp }}/test-hub.tar
          retention-days: 1
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        if: github.event_name == 'push'
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Publica no GHCR
        uses: docker/build-push-action@v7
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      TEST_HUB_IMAGE: test-hub:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: imagem-hub
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/test-hub.tar"
      - name: Sobe o ambiente completo
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest -m e2e
      - name: Logs do ambiente
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
